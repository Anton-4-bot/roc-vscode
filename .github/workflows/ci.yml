name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Package
        run: npx vsce package --out roc.vsix

      - name: Check the VSIX contents
        run: diff -u test/vsix-files.txt <(unzip -Z1 roc.vsix | LC_ALL=C sort)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: roc-vsix
          path: roc.vsix
          if-no-files-found: error

  # Tests the VSIX built above, so the tested file is the one that gets uploaded.
  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit and grammar tests
        run: npm test

      # The nightly is pinned in test/roc-nightly.txt and bumped by roc-nightly-bump.yml.
      # Uses the extension's own installer, so this also tests downloading, verifying and unpacking.
      - name: Install the pinned Roc nightly
        id: roc
        run: npm run test:nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: roc-vsix

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          ROC_PATH: ${{ steps.roc.outputs.roc }}
          ROC_VSIX: roc.vsix

      - name: Integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          ROC_PATH: ${{ steps.roc.outputs.roc }}
          ROC_VSIX: roc.vsix

      - name: Integration tests on the oldest supported VS Code
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          ROC_PATH: ${{ steps.roc.outputs.roc }}
          ROC_VSIX: roc.vsix
          VSCODE_VERSION: 1.91.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: vscode-logs-${{ matrix.os }}
          path: .vscode-test/user-data-*/logs
          if-no-files-found: ignore
          include-hidden-files: true

